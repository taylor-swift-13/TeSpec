<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">TeSpec concrete specification testing workflow</title>
  <desc id="desc">A publication-ready workflow from a QCP-annotated C program, imported Coq definitions and strategies, and concrete bindings through specialization, concrete symbolic execution, normalization, and QCP plus SMT checking to PASS, FAIL, or a residual proof.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#475569"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 31px; font-weight: 700; fill: #0F172A; letter-spacing: -0.4px; }
      .subtitle { font-size: 17px; font-weight: 400; fill: #64748B; }
      .stage { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 1.7px; }
      .card-title { font-size: 21px; font-weight: 700; fill: #0F172A; }
      .card-copy { font-size: 15px; font-weight: 400; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #334155; }
      .result-title { font-size: 18px; font-weight: 750; }
      .result-copy { font-size: 13px; font-weight: 450; fill: #475569; }
      .caption { font-size: 14px; font-weight: 500; fill: #64748B; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-light { fill: none; stroke: #94A3B8; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="720" rx="24" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1598" height="718" rx="23" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g class="sans">
    <text x="72" y="66" class="title">TeSpec concrete specification testing workflow</text>
    <text x="72" y="96" class="subtitle">One concrete test per binding · deterministic execution core · explicit proof provenance</text>

    <text x="72" y="151" class="stage">CONCRETE TEST INPUT</text>
    <text x="444" y="151" class="stage">DETERMINISTIC EXECUTION</text>
    <text x="1134" y="151" class="stage">SPECIFICATION CHECK</text>

    <!-- Input cards -->
    <g filter="url(#shadow)">
      <rect x="72" y="178" width="306" height="150" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="72" y="178" width="8" height="150" rx="4" fill="#334155"/>
    </g>
    <circle cx="112" cy="220" r="17" fill="#E2E8F0"/>
    <path d="M104 212h11l6 6v12h-17z M115 212v7h6" fill="none" stroke="#334155" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="142" y="218" class="card-title">Program + QCP spec</text>
    <text x="103" y="252" class="mono">C implementation</text>
    <text x="103" y="282" class="card-copy">Require / Ensure + dependencies</text>
    <text x="103" y="304" class="card-copy">headers · Coq .v · strategies</text>
    <text x="103" y="322" font-size="12" font-weight="500" fill="#64748B">SOURCE.c  ·  --function F</text>

    <g filter="url(#shadow)">
      <rect x="72" y="352" width="306" height="150" rx="18" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
      <rect x="72" y="352" width="8" height="150" rx="4" fill="#6366F1"/>
    </g>
    <circle cx="112" cy="394" r="17" fill="#E0E7FF"/>
    <path d="M104 388h16v13h-16z M108 385v6 M116 385v6" fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="142" y="399" class="card-title">Concrete bindings</text>
    <text x="103" y="439" class="mono">args  ·  values  ·  types</text>
    <text x="103" y="470" class="card-copy">Concrete C arguments and logical</text>
    <text x="103" y="492" class="card-copy">variables; optional Coq types.</text>

    <!-- Main pipeline -->
    <path class="flow" d="M378 253 H424"/>
    <path class="flow" d="M378 427 H402 Q424 427 424 405 V311"/>

    <g filter="url(#shadow)">
      <rect x="444" y="207" width="222" height="214" rx="18" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.7"/>
    </g>
    <rect x="464" y="228" width="58" height="27" rx="13.5" fill="#4F46E5"/>
    <text x="493" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">01</text>
    <text x="464" y="291" class="card-title">Analyze &amp; specialize</text>
    <text x="464" y="324" class="card-copy">Discover required bindings</text>
    <text x="464" y="348" class="card-copy">and inject the concrete test.</text>
    <line x1="464" y1="369" x2="646" y2="369" stroke="#C7D2FE"/>
    <text x="464" y="398" class="mono">closed test state</text>

    <path class="flow" d="M666 314 H704"/>

    <g filter="url(#shadow)">
      <rect x="724" y="178" width="276" height="272" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.7"/>
    </g>
    <rect x="744" y="199" width="58" height="27" rx="13.5" fill="#0E7490"/>
    <text x="773" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">02</text>
    <text x="744" y="262" font-size="19" font-weight="700" fill="#0F172A">Concrete symbolic execution</text>
    <text x="744" y="296" class="card-copy">Execute statements and finite loops.</text>
    <text x="744" y="322" class="card-copy">Inline visible callees at call sites.</text>
    <text x="744" y="348" class="card-copy">Evolve the shared separation heap.</text>
    <g>
      <rect x="744" y="377" width="66" height="28" rx="14" fill="#CFFAFE"/>
      <rect x="818" y="377" width="75" height="28" rx="14" fill="#CFFAFE"/>
      <rect x="901" y="377" width="77" height="28" rx="14" fill="#CFFAFE"/>
      <text x="777" y="396" text-anchor="middle" font-size="12" font-weight="650" fill="#155E75">loops</text>
      <text x="855.5" y="396" text-anchor="middle" font-size="12" font-weight="650" fill="#155E75">callees</text>
      <text x="939.5" y="396" text-anchor="middle" font-size="12" font-weight="650" fill="#155E75">heap</text>
    </g>

    <path class="flow" d="M1000 314 H1038"/>

    <g filter="url(#shadow)">
      <rect x="1058" y="207" width="222" height="214" rx="18" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.7"/>
    </g>
    <rect x="1078" y="228" width="58" height="27" rx="13.5" fill="#7C3AED"/>
    <text x="1107" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">03</text>
    <text x="1078" y="291" class="card-title">Normalize assertions</text>
    <text x="1078" y="324" class="card-copy">Reduce closed list, arithmetic,</text>
    <text x="1078" y="348" class="card-copy">constructor, and heap terms.</text>
    <line x1="1078" y1="369" x2="1260" y2="369" stroke="#DDD6FE"/>
    <text x="1078" y="398" class="mono">specialized VC</text>

    <path class="flow" d="M1280 314 H1318"/>

    <g filter="url(#shadow)">
      <rect x="1338" y="207" width="190" height="214" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.7"/>
    </g>
    <rect x="1358" y="228" width="58" height="27" rx="13.5" fill="#15803D"/>
    <text x="1387" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">04</text>
    <text x="1358" y="291" class="card-title">QCP + SMT</text>
    <text x="1358" y="324" class="card-copy">Check every obligation</text>
    <text x="1358" y="348" class="card-copy">for this concrete bind.</text>
    <line x1="1358" y1="369" x2="1508" y2="369" stroke="#BBF7D0"/>
    <text x="1358" y="398" class="mono">proof provenance</text>

    <!-- Results -->
    <path class="flow-light" d="M1433 421 V480"/>
    <path d="M1433 455 H526" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <circle cx="526" cy="455" r="4" fill="#CBD5E1"/>
    <circle cx="823" cy="455" r="4" fill="#CBD5E1"/>
    <circle cx="1120" cy="455" r="4" fill="#CBD5E1"/>
    <circle cx="1433" cy="455" r="4" fill="#CBD5E1"/>
    <path d="M526 455v25 M823 455v25 M1120 455v25" stroke="#CBD5E1" stroke-width="1.5"/>

    <g filter="url(#shadow)">
      <rect x="444" y="498" width="234" height="128" rx="16" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.6"/>
    </g>
    <circle cx="477" cy="532" r="14" fill="#16A34A"/>
    <path d="M470 532l5 5 9-11" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="502" y="538" class="result-title" fill="#166534">PASS</text>
    <text x="467" y="574" class="result-copy">All VCs closed by QCP / SMT.</text>
    <text x="467" y="598" class="mono">proof_auto.v</text>

    <g filter="url(#shadow)">
      <rect x="699" y="498" width="234" height="128" rx="16" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
    </g>
    <circle cx="732" cy="532" r="14" fill="#DC2626"/>
    <path d="M726 526l12 12 M738 526l-12 12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <text x="757" y="538" class="result-title" fill="#991B1B">FAIL</text>
    <text x="722" y="574" class="result-copy">A concrete obligation is false.</text>
    <text x="722" y="598" class="mono">counterexample evidence</text>

    <g filter="url(#shadow)">
      <rect x="954" y="498" width="272" height="128" rx="16" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.6"/>
    </g>
    <circle cx="987" cy="532" r="14" fill="#EA580C"/>
    <text x="987" y="538" text-anchor="middle" font-size="18" font-weight="750" fill="#FFFFFF">?</text>
    <text x="1012" y="538" class="result-title" fill="#9A3412">UNKNOWN</text>
    <text x="977" y="574" class="result-copy">Execution limit or unresolved VC.</text>
    <text x="977" y="598" class="mono">never treated as success</text>

    <g filter="url(#shadow)">
      <rect x="1247" y="498" width="281" height="128" rx="16" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.6"/>
    </g>
    <circle cx="1280" cy="532" r="14" fill="#9333EA"/>
    <path d="M1274 538l2-8 8-8 4 4-8 8z M1274 538l5-1" fill="none" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="1305" y="538" class="result-title" fill="#6B21A8">MANUAL RESIDUAL</text>
    <text x="1270" y="574" class="result-copy">Optional human / model Coq proof.</text>
    <text x="1270" y="598" class="mono">check-proof → Coq kernel</text>

    <line x1="72" y1="663" x2="1528" y2="663" stroke="#E2E8F0"/>
    <text x="72" y="691" class="caption">Figure 1. Each binding denotes one concrete execution; the original postcondition is checked over its actual final state.</text>
  </g>
</svg>
