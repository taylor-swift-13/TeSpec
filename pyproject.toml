[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcp-spectest"
version = "0.3.0"
description = "Run binding-specialized QCP symbolic specification tests"
requires-python = ">=3.10"

[project.scripts]
qcp-spectest = "spectest.cli:main"

[tool.setuptools]
packages = ["spectest"]
