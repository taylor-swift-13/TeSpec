[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcp-spectest"
version = "0.3.0"
description = "Run binding-specialized QCP symbolic specification tests"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
qcp-spectest = "spectest.cli:main"

[tool.setuptools]
packages = ["spectest"]

[tool.ruff]
target-version = "py310"
line-length = 88
